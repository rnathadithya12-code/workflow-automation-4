<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">Lab 2 e-commerce order processing design preview</title>
  <desc id="desc">A left-to-right order workflow with validation, stock check, payment, priority decision, manual review, and fulfilment.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><style>.title{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#ffffff}.sub{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}.label{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.small{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.worker{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.connector{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}.dmn{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.human{fill:#fef3c7;stroke:#d97706;stroke-width:2}.end{fill:#f8fafc;stroke:#334155;stroke-width:2}.gateway{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.legend{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#334155}</style></defs>
  <rect width="1500" height="560" fill="#f8fafc"/><rect x="24" y="20" width="1452" height="74" rx="16" fill="#0f172a"/><text x="52" y="53" class="title">E-commerce order processing and fulfilment</text><text x="52" y="77" class="sub">Camunda 8 design preview · validation · inventory · mock payment · priority review</text>
  <path class="edge" d="M70 250 H100"/><path class="edge" d="M245 250 H285"/><path class="edge" d="M455 250 H490"/><path class="edge" d="M540 250 H590"/><path class="edge" d="M770 250 H805"/><path class="edge" d="M855 250 H900"/><path class="edge" d="M1060 250 H1095"/><path class="edge" d="M1120 225 V155 H1175"/><path class="edge" d="M1120 275 V330 H1175"/><path class="edge" d="M1260 195 V330"/><path class="edge" d="M1345 330 H1390"/><path class="edge" d="M515 275 V440 H590"/><path class="edge" d="M830 275 V440 H900"/>
  <circle cx="52" cy="250" r="18" fill="#fff" stroke="#0f766e" stroke-width="3"/>
  <rect x="100" y="210" width="145" height="80" rx="12" class="worker"/><text x="172" y="244" text-anchor="middle" class="label">Validate</text><text x="172" y="262" text-anchor="middle" class="label">order</text><text x="172" y="279" text-anchor="middle" class="small">worker</text>
  <rect x="285" y="210" width="170" height="80" rx="12" class="worker"/><text x="370" y="240" text-anchor="middle" class="label">Check stock</text><text x="370" y="258" text-anchor="middle" class="label">and total</text><text x="370" y="276" text-anchor="middle" class="small">worker</text>
  <polygon points="515,225 540,250 515,275 490,250" class="gateway"/><text x="515" y="310" text-anchor="middle" class="small">stock?</text>
  <rect x="590" y="210" width="180" height="80" rx="12" class="connector"/><text x="680" y="240" text-anchor="middle" class="label">Process payment</text><text x="680" y="258" text-anchor="middle" class="label">via REST</text><text x="680" y="276" text-anchor="middle" class="small">HTTP JSON connector</text>
  <polygon points="830,225 855,250 830,275 805,250" class="gateway"/><text x="830" y="310" text-anchor="middle" class="small">payment?</text>
  <rect x="900" y="210" width="160" height="80" rx="12" class="dmn"/><text x="980" y="240" text-anchor="middle" class="label">Determine</text><text x="980" y="258" text-anchor="middle" class="label">priority</text><text x="980" y="276" text-anchor="middle" class="small">DMN table</text>
  <polygon points="1120,225 1145,250 1120,275 1095,250" class="gateway"/><text x="1120" y="310" text-anchor="middle" class="small">high value?</text>
  <rect x="1175" y="115" width="170" height="80" rx="12" class="human"/><text x="1260" y="148" text-anchor="middle" class="label">Verify high-value</text><text x="1260" y="166" text-anchor="middle" class="label">order</text><text x="1260" y="184" text-anchor="middle" class="small">Tasklist</text>
  <rect x="1175" y="290" width="170" height="80" rx="12" class="worker"/><text x="1260" y="323" text-anchor="middle" class="label">Release to</text><text x="1260" y="341" text-anchor="middle" class="label">fulfilment</text><text x="1260" y="359" text-anchor="middle" class="small">worker</text>
  <circle cx="1408" cy="330" r="18" fill="#fff" stroke="#334155" stroke-width="3"/><rect x="590" y="412" width="115" height="56" rx="12" class="end"/><text x="647" y="437" text-anchor="middle" class="label">Out of stock</text><text x="647" y="454" text-anchor="middle" class="small">end</text><rect x="900" y="412" width="125" height="56" rx="12" class="end"/><text x="962" y="437" text-anchor="middle" class="label">Payment declined</text><text x="962" y="454" text-anchor="middle" class="small">end</text><text x="52" y="292" text-anchor="middle" class="small">start</text><text x="1408" y="372" text-anchor="middle" class="small">end</text>
  <rect x="44" y="492" width="1412" height="44" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="66" y="506" width="16" height="16" rx="4" class="worker"/><text x="90" y="519" class="legend">Worker</text><rect x="164" y="506" width="16" height="16" rx="4" class="connector"/><text x="188" y="519" class="legend">REST connector</text><rect x="310" y="506" width="16" height="16" rx="4" class="dmn"/><text x="334" y="519" class="legend">DMN</text><rect x="408" y="506" width="16" height="16" rx="4" class="human"/><text x="432" y="519" class="legend">Human review</text><polygon points="560,506 568,514 560,522 552,514" class="gateway"/><text x="580" y="519" class="legend">Exclusive route</text><text x="850" y="519" class="legend">All order and payment data is synthetic</text>
</svg>

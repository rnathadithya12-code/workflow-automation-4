<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc">
  <title id="title">Lab 3 hospital appointment and patient triage design preview</title>
  <desc id="desc">A clean triage process with registration, DMN classification, urgent and priority human review, scheduling connector, and booking or no-slot routes.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker><style>.title{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#ffffff}.sub{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}.label{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.small{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.worker{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.connector{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}.dmn{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.human{fill:#fef3c7;stroke:#d97706;stroke-width:2}.end{fill:#f8fafc;stroke:#334155;stroke-width:2}.gateway{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.legend{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#334155}</style></defs>
  <rect width="1400" height="580" fill="#f8fafc"/><rect x="24" y="20" width="1352" height="74" rx="16" fill="#0f172a"/><text x="52" y="53" class="title">Hospital appointment and patient triage</text><text x="52" y="77" class="sub">Camunda 8 design preview · synthetic registration · educational DMN triage · mock scheduling</text>
  <path class="edge" d="M70 250 H105"/><path class="edge" d="M255 250 H295"/><path class="edge" d="M460 250 H500"/><path class="edge" d="M525 225 V140 H595"/><path class="edge" d="M550 250 H595"/><path class="edge" d="M525 275 V350 H595"/><path class="edge" d="M785 140 H835"/><path class="edge" d="M690 265 V300"/><path class="edge" d="M785 340 H840"/><path class="edge" d="M890 340 H935"/><path class="edge" d="M865 365 V445 H935"/><path class="edge" d="M1110 310 H1150"/><path class="edge" d="M1110 430 H1150"/>
  <circle cx="52" cy="250" r="18" fill="#fff" stroke="#0f766e" stroke-width="3"/><rect x="105" y="210" width="150" height="80" rx="12" class="worker"/><text x="180" y="244" text-anchor="middle" class="label">Validate</text><text x="180" y="262" text-anchor="middle" class="label">registration</text><text x="180" y="280" text-anchor="middle" class="small">worker</text>
  <rect x="295" y="210" width="165" height="80" rx="12" class="dmn"/><text x="377" y="244" text-anchor="middle" class="label">Evaluate</text><text x="377" y="262" text-anchor="middle" class="label">educational triage</text><text x="377" y="280" text-anchor="middle" class="small">DMN table</text><polygon points="525,225 550,250 525,275 500,250" class="gateway"/><text x="525" y="312" text-anchor="middle" class="small">category</text>
  <rect x="595" y="100" width="190" height="80" rx="12" class="human"/><text x="690" y="133" text-anchor="middle" class="label">Immediate staff</text><text x="690" y="151" text-anchor="middle" class="label">assessment</text><text x="690" y="169" text-anchor="middle" class="small">urgent human task</text><circle cx="853" cy="120" r="18" fill="#fff" stroke="#334155" stroke-width="3"/><text x="853" y="188" text-anchor="middle" class="small">urgent end</text>
  <rect x="595" y="210" width="190" height="80" rx="12" class="human"/><text x="690" y="243" text-anchor="middle" class="label">Review priority</text><text x="690" y="261" text-anchor="middle" class="label">request</text><text x="690" y="279" text-anchor="middle" class="small">Tasklist</text>
  <rect x="595" y="300" width="190" height="80" rx="12" class="connector"/><text x="690" y="333" text-anchor="middle" class="label">Find appointment</text><text x="690" y="351" text-anchor="middle" class="label">slots via REST</text><text x="690" y="369" text-anchor="middle" class="small">HTTP JSON connector</text><polygon points="865,315 890,340 865,365 840,340" class="gateway"/><text x="865" y="402" text-anchor="middle" class="small">slot?</text>
  <rect x="935" y="270" width="175" height="80" rx="12" class="worker"/><text x="1022" y="303" text-anchor="middle" class="label">Reserve synthetic</text><text x="1022" y="321" text-anchor="middle" class="label">slot</text><text x="1022" y="339" text-anchor="middle" class="small">worker</text><circle cx="1168" cy="310" r="18" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1168" y="270" text-anchor="middle" class="small">booked</text>
  <rect x="935" y="405" width="175" height="80" rx="12" class="human"/><text x="1022" y="438" text-anchor="middle" class="label">Offer alternative</text><text x="1022" y="456" text-anchor="middle" class="label">appointment</text><text x="1022" y="474" text-anchor="middle" class="small">Tasklist</text><circle cx="1168" cy="445" r="18" fill="#fff" stroke="#334155" stroke-width="3"/><text x="1168" y="505" text-anchor="middle" class="small">no-slot end</text><text x="52" y="292" text-anchor="middle" class="small">start</text>
  <rect x="44" y="525" width="1312" height="40" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="66" y="537" width="16" height="16" rx="4" class="worker"/><text x="90" y="550" class="legend">Worker</text><rect x="164" y="537" width="16" height="16" rx="4" class="connector"/><text x="188" y="550" class="legend">REST connector</text><rect x="310" y="537" width="16" height="16" rx="4" class="dmn"/><text x="334" y="550" class="legend">DMN</text><rect x="408" y="537" width="16" height="16" rx="4" class="human"/><text x="432" y="550" class="legend">Human task</text><polygon points="560,537 568,545 560,553 552,545" class="gateway"/><text x="580" y="550" class="legend">Exclusive route</text><text x="850" y="550" class="legend">Synthetic educational patient data only</text>
</svg>

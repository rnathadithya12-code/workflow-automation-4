spring:
  application:
    name: workflow-automation-4-workers

server:
  port: ${SERVER_PORT:8080}

camunda:
  client:
    mode: ${CAMUNDA_CLIENT_MODE:self-managed}
    zeebe:
      grpc-address: ${CAMUNDA_ZEEBE_GRPC_ADDRESS:http://localhost:26500}
      rest-address: ${CAMUNDA_ZEEBE_REST_ADDRESS:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

workflow:
  mock:
    inventory-version: educational-2026-01
